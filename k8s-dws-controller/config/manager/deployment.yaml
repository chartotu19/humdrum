apiVersion: v1
kind: Namespace
metadata:
  name: dws-system
  labels:
    app.kubernetes.io/name: dws-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dws-controller-manager
  namespace: dws-system
  labels:
    app.kubernetes.io/name: dws-controller
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dws-controller
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dws-controller
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: dws-controller
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: dws-controller:latest
          command:
            - /manager
          args:
            - --leader-elect
            - --max-concurrent-per-queue=5
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
